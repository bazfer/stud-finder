name: Stud Finder self-scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  self-scan:
    name: Stud Finder self-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run Stud Finder against PR diff
        id: scan
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          git fetch origin "${BASE_REF}"
          bundle exec stud-finder . --diff-base "origin/${BASE_REF}" --output markdown > risk.md 2> stud-finder-self-scan.err
          status=$?
          {
            echo 'marker=<!-- stud-finder-self-scan -->'
            echo 'status<<EOF'
            echo "${status}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            {
              echo '## Stud Finder self-scan'
              echo
              echo '> Observation mode: scan failed, so no risk table was produced.'
              echo
              echo '```text'
              cat stud-finder-self-scan.err
              echo '```'
            } > risk.md
          fi

      - name: Ensure risk.md is not empty
        run: |
          if [ ! -s risk.md ]; then
            echo "_stud-finder: no Ruby or JS/TS files changed in this PR — nothing to score._" > risk.md
          fi

      - name: Post sticky PR comment
        if: github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- stud-finder-self-scan -->';
            const scan = fs.readFileSync('risk.md', 'utf8');
            const body = `${marker}\n${scan}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
