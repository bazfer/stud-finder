name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rspec:
    name: RSpec (${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  rspec-head:
    name: RSpec (head, optional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: setup-ruby
        uses: ruby/setup-ruby@v1
        continue-on-error: true
        with:
          ruby-version: head
          bundler-cache: true
      - if: steps.setup-ruby.outcome == 'success'
        run: |
          if ! bundle exec rspec; then
            echo "::warning::Ruby head RSpec failed; stable Ruby jobs remain required."
          fi
      - if: steps.setup-ruby.outcome != 'success'
        run: echo "::warning::Ruby head setup failed; stable Ruby jobs remain required."

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rubocop

  gem-build:
    name: Gem build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: gem build stud-finder.gemspec
