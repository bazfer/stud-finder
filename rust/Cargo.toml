[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["bazfer <bazfer@gmail.com>"]
repository = "https://github.com/bazfer/stud-finder"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
sf-core = { path = "crates/sf-core" }
sf-coverage = { path = "crates/sf-coverage" }
sf-history = { path = "crates/sf-history" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
